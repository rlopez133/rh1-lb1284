---
- name: Uninstall the OpenFlake release
  kubernetes.core.helm:
    name: "{{ openflake_release_name }}"
    namespace: "{{ openflake_namespace }}"
    binary_path: "{{ openflake_helm_binary | default(omit, true) }}"
    wait: "{{ openflake_wait | bool }}"
    wait_timeout: "{{ openflake_wait_timeout }}"
    state: absent

# `helm uninstall --wait` returns once the API objects are deleted, but pods
# can linger through their termination grace period. Confirm they are actually
# gone before touching the namespace, so a delete does not race the teardown.
- name: Wait for the release's workloads to disappear
  kubernetes.core.k8s_info:
    kind: "{{ item }}"
    namespace: "{{ openflake_namespace }}"
    label_selectors:
      - "app.kubernetes.io/instance={{ openflake_release_name }}"
      - "app.kubernetes.io/part-of=openflake"
  register: _openflake_leftovers
  retries: "{{ openflake_verify_retries }}"
  delay: "{{ openflake_verify_delay }}"
  until: (_openflake_leftovers.resources | default([]) | length) == 0
  loop:
    - Deployment
    - StatefulSet
    - Pod

- name: Report what the uninstall left behind
  ansible.builtin.debug:
    msg: >-
      Release '{{ openflake_release_name }}' is uninstalled and its workloads
      are gone from namespace '{{ openflake_namespace }}'.
      {% if not (openflake_remove_pvcs | bool) and not (openflake_remove_namespace | bool) %}
      The PersistentVolumeClaims were kept, so a later deploy reattaches to the
      existing database and attachments. Pass openflake_remove_pvcs=true or
      openflake_remove_namespace=true to destroy them.
      {% endif %}

# `helm uninstall` leaves both PVCs behind: the attachments claim carries
# helm.sh/resource-policy=keep, and the Postgres claim belongs to the
# StatefulSet's volumeClaimTemplate. That is deliberate -- removing them
# destroys every ticket, CI and attachment in the instance.
- name: Delete the persistent volume claims
  when:
    - openflake_remove_pvcs | bool
    # Skipped when the namespace is going away anyway: deleting the claims and
    # then the namespace means waiting out the same teardown twice.
    - not (openflake_remove_namespace | bool)
  block:
    - name: Warn that data is about to be destroyed
      ansible.builtin.debug:
        msg: >-
          openflake_remove_pvcs is true: deleting the OpenFlake database and
          attachment volumes in namespace '{{ openflake_namespace }}'. This
          cannot be undone.

    - name: Find the claims belonging to this release
      kubernetes.core.k8s_info:
        kind: PersistentVolumeClaim
        namespace: "{{ openflake_namespace }}"
        label_selectors:
          - "app.kubernetes.io/instance={{ openflake_release_name }}"
          - "app.kubernetes.io/part-of=openflake"
      register: _openflake_pvcs

    - name: Delete each claim
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: "{{ openflake_namespace }}"
        name: "{{ item.metadata.name }}"
        wait: true
      loop: "{{ _openflake_pvcs.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"

# Deleting the namespace takes everything in it, including any PVCs that
# openflake_remove_pvcs left alone and anything unrelated that happens to share
# the namespace. Left off by default for that reason.
- name: Delete the namespace
  when: openflake_remove_namespace | bool
  block:
    - name: List what is still in the namespace
      kubernetes.core.k8s_info:
        kind: PersistentVolumeClaim
        namespace: "{{ openflake_namespace }}"
      register: _openflake_remaining_pvcs

    - name: Warn about everything the namespace delete will take with it
      ansible.builtin.debug:
        msg: >-
          Deleting namespace '{{ openflake_namespace }}'. This also removes
          {{ _openflake_remaining_pvcs.resources | default([]) | length }}
          PersistentVolumeClaim(s) still in it
          {% if (_openflake_remaining_pvcs.resources | default([]) | length) > 0 -%}
          ({{ _openflake_remaining_pvcs.resources | map(attribute='metadata.name') | join(', ') }})
          {%- endif %}, regardless of openflake_remove_pvcs, along with any
          unrelated resources sharing the namespace. This cannot be undone.

    - name: Remove the namespace
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Namespace
        name: "{{ openflake_namespace }}"
        wait: true
        wait_timeout: "{{ openflake_namespace_delete_timeout | int }}"

    # A namespace stuck Terminating means something in it has a finalizer that
    # is not completing, which `wait` reports as success once the delete is
    # accepted. Check the object is really gone.
    - name: Confirm the namespace is gone
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ openflake_namespace }}"
      register: _openflake_ns_check
      retries: "{{ openflake_verify_retries }}"
      delay: "{{ openflake_verify_delay }}"
      until: (_openflake_ns_check.resources | default([]) | length) == 0
      failed_when: false

    - name: Fail when the namespace is still terminating
      ansible.builtin.fail:
        msg: >-
          Namespace '{{ openflake_namespace }}' is still
          {{ (_openflake_ns_check.resources | first).status.phase | default('present') }}
          after {{ openflake_verify_retries | int * openflake_verify_delay | int }}s.
          Something in it has a finalizer that has not completed --
          `oc get all,pvc -n {{ openflake_namespace }}` will show what.
      when: (_openflake_ns_check.resources | default([]) | length) > 0
